version: '3.8'

services:
  backend:
    build: ./backend
    container_name: smartai_backend
    restart: always
    env_file: .env
    ports:
      - "5000:5000"
    depends_on:
      - db
      - redis
    networks:
      - campus_network

  frontend:
    build: ./frontend
    container_name: smartai_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - campus_network

  db:
    image: postgres:14-alpine
    container_name: smartai_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: smartai_campus
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - campus_network

  redis:
    image: redis:6-alpine
    container_name: smartai_redis
    networks:
      - campus_network

networks:
  campus_network:
    driver: bridge

volumes:
  postgres_data:
